<script language=JavaScript>
 function checarDigitacao(objEvent, expressaoRegular)
 {
      //seta a variável de documento com o valor 1 representando 
      //que o evento key_press esta sendo usando
      document.flag_keypress = 1;
      var charCode = event.keyCode;
      if (charCode==13)
      {
          document.retorno_keypress = true;
          return document.retorno_keypress;
      }
      texto = String.fromCharCode(objEvent.keyCode);
      if (expressaoRegular.test(texto) == true)
      {
          document.retorno_keypress = true;
          return document.retorno_keypress;
      }
      else
      {
          document.retorno_keypress = false;
          return document.retorno_keypress;
      }
 }
 function checarColagem(objEvent, expressaoRegular)
 {
      var strDadosAreaTransf = window.clipboardData.getData('Text');
      if (expressaoRegular.test(strDadosAreaTransf) == true)
      {
          return true;
      }
      else
      {
          return false;
      }
 }
</script>

<script language='JavaScript'>
function ativar_mascara_nota(ClienteID)
{
 ativar_legenda_validacao();
    var Lstr_value = document.getElementById(ClienteID).value;
    document.getElementById(ClienteID).value = Lstr_value.replace(/\./g,'');
    var str;
    var i;
    var e = document.getElementById(ClienteID).value;
    if (e.length < 44) 
    { i = 44 - e.length; 
      for (j=1;j<=i;j++)
          e = '0' + e;
    }
    str = e.substr(0,2);
    str = str + '-' + e.substr(2,4);
    str = str + '-' + e.substr(6,2);
    str = str + '.' + e.substr(8,3);
    str = str + '.' + e.substr(11,3);
    str = str + '/' + e.substr(14,4);
    str = str + '-' + e.substr(18,2);
    str = str + '-' + e.substr(20,2);
    str = str + '-' + e.substr(22,3);
    str = str + '-' + e.substr(25,3);
    str = str + '.' + e.substr(28,3);
    str = str + '.' + e.substr(31,3);
    str = str + '-' + e.substr(34,3);
    str = str + '.' + e.substr(37,3);
    str = str + '.' + e.substr(40,3);
    str = str + '-' + e.substr(43,1);
    if (str == '00-0000-00.000.000/0000-00-00-000-000.000.000-000.000.000-0')
       document.getElementById(ClienteID).value = '';
    else
       document.getElementById(ClienteID).value = str;
}
</script>
<script language='JavaScript'>
function desativar_mascara_nota(ClienteID)
{
    var str = '';
    var i;
    var flag = 'false';
    var e = document.getElementById(ClienteID).value;
    for (i=0;i<e.length;i++)
    {
       if (flag == 'false')
       { 
          if ((e.substr(i,1) == '1') || (e.substr(i,1) == '2') || (e.substr(i,1) == '3') || 
              (e.substr(i,1) == '4') || (e.substr(i,1) == '5') || (e.substr(i,1) == '6') || 
              (e.substr(i,1) == '7') || (e.substr(i,1) == '8') || (e.substr(i,1) == '9')) 
          { 
             flag = 'true';
             str += e.substr(i,1);
          } 
       } 
       else 
          if ((e.substr(i,1)!='.') && (e.substr(i,1)!='/') && (e.substr(i,1)!='-'))
             str += e.substr(i,1);
    }
    document.getElementById(ClienteID).value = str;
}
</script>
