# Render Blueprint — Economiza AI backend (dev + prod).
# ---------------------------------------------------------------------------
# THE RENDER DASHBOARD IS THE SOURCE OF TRUTH. The live services were created
# and are changed in the dashboard / through the Render API, not by applying
# this file. It documents what runs (see INFRASTRUCTURE.md for IDs, domains
# and history) and is the starting point for standing up a fresh environment.
# Do NOT re-apply it over the live services without diffing first, and keep
# it in step when a service changes.
#
# Two environments, each = one web service (the Spring Boot app, built from the
# repo Dockerfile) + its own managed Postgres. Never point both at one DB.
#
#   prod  economizai-api-prod   branch main         Standard (2 GB)  api.economizaai.app
#   dev   economizaai-api-dev   branch development  Free (512 MB)    api-dev.economizaai.app
#
# No disk on either service: profile pictures and receipt photos live in
# Cloudflare R2, which is what allows zero-downtime deploys. Logs go to stdout.
# Region is not recorded here — use the same region for a service and its DB.
#
# SECRETS are marked `sync: false`: they are filled in the dashboard and never
# live in git. An optional integration left blank simply stays off (fail-closed).
#
# DATABASE_URL: the app needs the JDBC form (jdbc:postgresql://<host>:5432/<db>).
# Render's `fromDatabase … connectionString` yields a plain postgresql:// URL,
# which the JDBC driver rejects — so DATABASE_URL, DB_USERNAME and DB_PASSWORD
# are set BY HAND from the Postgres "Info" tab (use the INTERNAL host).
#
# Everything not listed has a safe default in application.yaml; the full list of
# tuning variables is in INFRASTRUCTURE.md → "Environment variables".
# ---------------------------------------------------------------------------

databases:
  - name: economizai-db-prod
    plan: basic-256mb          # never the free tier — a free Postgres expires in 30 days
    postgresMajorVersion: "18"

  - name: economizaai-db-dev
    plan: basic-256mb
    postgresMajorVersion: "18"

services:
  # ------------------------------------------------------------------ PROD --
  - type: web
    name: economizai-api-prod
    runtime: docker
    plan: standard             # 2 GB — the JVM does not fit in less
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true           # a merge into `main` IS the prod deploy (owner-gated, see DEPLOY.md)
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod            # no weak defaults: boot fails without the required vars; Swagger off

      # --- Database (by hand, JDBC form — see header) ---
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # --- Security ---
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false            # real FE origins only, comma-separated
      - key: ADMIN_EMAILS
        sync: false
      - key: METRICS_PASSWORD
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: APPLE_OAUTH_CLIENT_IDS
        sync: false

      # --- SEFAZ scanning (paid) ---
      - key: CAPTCHA_PROVIDER
        value: capsolver
      - key: CAPTCHA_API_KEY
        sync: false
      - key: INFOSIMPLES_ENABLED
        value: "true"
      - key: INFOSIMPLES_API_KEY
        sync: false

      # --- AI layer (photo extraction, HTML rescue, categorization) ---
      - key: ANTHROPIC_API_KEY
        sync: false

      # --- Daily spend ceiling per paid service, in cents (owner decision 2026-11-11) ---
      - key: PAID_API_BUDGET_INFOSIMPLES_CENTS
        value: "12000"
      - key: PAID_API_BUDGET_CAPTCHA_CENTS
        value: "3000"
      - key: PAID_API_BUDGET_LLM_VISION_CENTS
        value: "3000"
      - key: PAID_API_BUDGET_LLM_HTML_RESCUE_CENTS
        value: "1500"
      - key: PAID_API_BUDGET_LLM_CATEGORIZATION_CENTS
        value: "5000"
      - key: PAID_API_BUDGET_TWILIO_CENTS
        value: "1500"

      # --- Object storage (Cloudflare R2) ---
      - key: PROFILE_PICTURE_STORAGE
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # --- E-mail ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # --- Push / SMS / WhatsApp ---
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_SMS
        sync: false
      - key: TWILIO_FROM_WHATSAPP
        sync: false
      - key: ADMIN_PHONE_NUMBERS
        sync: false            # where the admin WhatsApp alerts (cost ceilings, ops) go

      # --- Billing (inert until credentialed) ---
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false

      # --- Behaviour flags ---
      - key: SIGNUP_ALERT_ENABLED
        value: "false"         # no admin alert per signup during the campaign (owner decision 2026-11-11)
      - key: SUBSCRIPTION_ENFORCE
        value: "false"         # the owner flips it when charging starts

  # ------------------------------------------------------------------- DEV --
  - type: web
    name: economizaai-api-dev
    runtime: docker
    plan: free                 # sleeps after 15 min idle; cold start ~3 min
    branch: development
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true           # every merge into `development` redeploys dev
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev,lowmem      # lowmem: lazy beans, no boot backfills, delayed jobs (fits 512 MB)
      - key: JAVA_TOOL_OPTIONS
        sync: false            # the heap/metaspace flags that make the app fit in 512 MB — see DEV_NOTES

      # --- Database (by hand, JDBC form — see header) ---
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # --- Security ---
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false

      # --- SEFAZ scanning (paid; bounded by the ceilings below) ---
      - key: CAPTCHA_PROVIDER
        value: capsolver
      - key: CAPTCHA_API_KEY
        sync: false
      - key: INFOSIMPLES_ENABLED
        value: "true"
      - key: INFOSIMPLES_API_KEY
        sync: false

      # --- AI layer ---
      - key: ANTHROPIC_API_KEY
        sync: false

      # --- Daily spend ceiling per paid service, in cents (owner decision 2026-11-11) ---
      - key: PAID_API_BUDGET_INFOSIMPLES_CENTS
        value: "12000"
      - key: PAID_API_BUDGET_CAPTCHA_CENTS
        value: "3000"
      - key: PAID_API_BUDGET_LLM_VISION_CENTS
        value: "3000"
      - key: PAID_API_BUDGET_LLM_HTML_RESCUE_CENTS
        value: "1500"
      - key: PAID_API_BUDGET_LLM_CATEGORIZATION_CENTS
        value: "5000"
      - key: PAID_API_BUDGET_TWILIO_CENTS
        value: "1500"

      # --- Object storage (Cloudflare R2 — the dev bucket) ---
      - key: PROFILE_PICTURE_STORAGE
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # --- E-mail (test mail goes to the QA mailbox, never the main inbox) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_RECIPIENT
        sync: false
      - key: BETA_RECIPIENT
        sync: false
